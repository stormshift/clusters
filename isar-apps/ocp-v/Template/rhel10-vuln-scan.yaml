kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: rhel10-server-small-vuln-scan
  namespace: openshift
  labels:
    app.kubernetes.io/part-of: hyperconverged-cluster
    template.kubevirt.io/architecture: amd64
    flavor.template.kubevirt.io/small: 'true'
    app.kubernetes.io/version: 4.20.3
    app.kubernetes.io/component: templating
    app.kubernetes.io/name: custom-templates
    template.kubevirt.io/type: vm
    vm.kubevirt.io/template: rhel10-server-small-vuln-scan
    vm.kubevirt.io/template.namespace: openshift
    os.template.kubevirt.io/rhel10.0: 'true'
    workload.template.kubevirt.io/server: 'true'
  annotations:
    template.kubevirt.io/provider: Red Hat GmbH - TechSales
    template.kubevirt.io/provider-url: 'https://www.redhat.com'
    template.kubevirt.io/containerdisks: |
      registry.redhat.io/rhel10/rhel-guest-image
    template.kubevirt.io/version: v1alpha1
    openshift.io/display-name: Red Hat Enterprise Linux 10 VM - VulnScanEnabled (roxagent via Ansible)
    openshift.io/documentation-url: 'https://github.com/kubevirt/common-templates'
    template.kubevirt.io/images: |
      https://access.redhat.com/downloads/content/rhel10
    defaults.template.kubevirt.io/disk: rootdisk
    name.os.template.kubevirt.io/rhel10.0: Red Hat Enterprise Linux 10.0 or higher
    template.kubevirt.io/editable: |
      /objects[0].spec.template.spec.domain.cpu.sockets
      /objects[0].spec.template.spec.domain.cpu.cores
      /objects[0].spec.template.spec.domain.cpu.threads
      /objects[0].spec.template.spec.domain.memory.guest
      /objects[0].spec.template.spec.domain.devices.disks
      /objects[0].spec.template.spec.volumes
      /objects[0].spec.template.spec.networks
    template.openshift.io/bindable: 'false'
    openshift.kubevirt.io/pronounceable-suffix-for-name-expression: 'true'
    tags: 'kubevirt,virtualmachine,linux,rhel,vuln-scan'
    template.kubevirt.io/provider-support-level: Full
    description: >-
      Template for Red Hat Enterprise Linux 10 VM or newer with RHACS vulnerability scanning.
      Requires a namespace Secret (default rhsm-cloud-init) with cloud-init userdata including
      rh_subscription and a ansible ssh key before the VM is started. Roxagent is installed via Ansible, via AAP (manually)
      A DataSource with the RHEL disk image must be available.
    openshift.io/support-url: 'https://github.com/kubevirt/common-templates/issues'
    iconClass: icon-rhel
    openshift.io/provider-display-name: Red Hat GmbH - TechSales
objects:
  - apiVersion: kubevirt.io/v1
    kind: VirtualMachine
    metadata:
      annotations:
        vm.kubevirt.io/validations: |
          [
            {
              "name": "minimal-required-memory",
              "path": "jsonpath::.spec.domain.memory.guest",
              "rule": "integer",
              "message": "This VM requires more memory.",
              "min": 1610612736
            }
          ]
      labels:
        app: '${NAME}'
        kubevirt.io/dynamic-credentials-support: 'true'
        stormshift.coe.muc.redhat.com/roxagent: 'true'
        vm.kubevirt.io/template: rhel10-server-small-vuln-scan
        vm.kubevirt.io/template.revision: '1'
        vm.kubevirt.io/template.namespace: openshift
      name: '${NAME}'
    spec:
      dataVolumeTemplates:
        - apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: '${NAME}'
          spec:
            sourceRef:
              kind: DataSource
              name: '${DATA_SOURCE_NAME}'
              namespace: '${DATA_SOURCE_NAMESPACE}'
            storage:
              resources:
                requests:
                  storage: 30Gi
      runStrategy: Halted
      template:
        metadata:
          annotations:
            vm.kubevirt.io/flavor: small
            vm.kubevirt.io/os: rhel10
            vm.kubevirt.io/workload: server
          labels:
            kubevirt.io/domain: '${NAME}'
            kubevirt.io/size: small
            stormshift.coe.muc.redhat.com/roxagent: 'true'
        spec:
          architecture: amd64
          domain:
            cpu:
              cores: 1
              features:
              - name: vmx-rdseed-exit
                policy: disable
              model: Haswell-v4
              sockets: 1
              threads: 1
            devices:
              disks:
                - disk:
                    bus: virtio
                  name: rootdisk
                - disk:
                    bus: virtio
                  name: cloudinitdisk
              interfaces:
                - masquerade: {}
                  model: virtio
                  name: default
              rng: {}
              autoattachVSOCK: true
            features:
              smm:
                enabled: true
            firmware:
              bootloader:
                efi: {}
            memory:
              guest: 2Gi
          networks:
            - name: default
              pod: {}
          terminationGracePeriodSeconds: 180
          volumes:
            - dataVolume:
                name: '${NAME}'
              name: rootdisk
            - cloudInitNoCloud:
                secretRef:
                  name: '${RHSM_CLOUD_INIT_SECRET}'
              name: cloudinitdisk
parameters:
  - name: NAME
    description: VM name
    generate: expression
    from: 'rhel10-[a-z0-9]{16}'
  - name: VM_NAMESPACE
    description: OpenShift namespace (project) where the VM is deployed
    value: sluetzen-vm-vuln-demo
  - name: DATA_SOURCE_NAME
    description: Name of the DataSource to clone
    value: rhel10
  - name: DATA_SOURCE_NAMESPACE
    description: Namespace of the DataSource
    value: openshift-virtualization-os-images
  - name: RHSM_CLOUD_INIT_SECRET
    description: >-
      Name of the namespace Secret containing cloud-init userdata (key userdata) with
      rh_subscription credentials. Create once per project; see rhsm-cloud-init-secret.yaml.example.
    value: rhsm-cloud-init
